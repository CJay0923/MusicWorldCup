<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌曲世界杯 · 二选一</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://y.gtimg.cn" crossorigin />
    <link rel="preconnect" href="https://u.y.qq.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0e0f12;
        color: #ece8e1;
        font-family:
          'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui,
          sans-serif;
        user-select: none;
      }
      #initial-loader .il-ring {
        width: 48px;
        height: 48px;
        color: #ff5470;
        animation: il-spin 1s linear infinite;
      }
      #initial-loader .il-ring svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #initial-loader .il-wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      #initial-loader .il-title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #ffffff;
      }
      #initial-loader .il-sub {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #6b6862;
      }
      #initial-loader .il-text {
        font-size: 12px;
        letter-spacing: 1px;
        color: #7d7972;
        animation: il-pulse 2s ease-in-out infinite;
      }
      @keyframes il-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes il-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="il-ring" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle
              cx="24"
              cy="24"
              r="20"
              stroke="currentColor"
              stroke-width="5"
              stroke-linecap="round"
              stroke-dasharray="90 125"
              opacity="1"
            />
          </svg>
        </div>
        <div class="il-wordmark">
          <span class="il-title">歌曲世界杯</span>
          <span class="il-sub">SONG WORLD CUP</span>
        </div>
        <div class="il-text">正在入场…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
