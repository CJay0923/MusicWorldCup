<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>歌曲世界杯 · 二选一</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://y.gtimg.cn" crossorigin />
    <link rel="preconnect" href="https://u.y.qq.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <style>
      /* 内联首屏加载样式 — 漫画涂鸦风 */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4ede0;
        color: #1a1a1a;
        font-family:
          'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif;
      }
      #initial-loader .il-trophy {
        font-size: 56px;
        filter: drop-shadow(3px 3px 0 #1a1a1a);
        animation: il-bounce 1.6s ease-in-out infinite;
      }
      #initial-loader .il-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(26, 26, 26, 0.15);
        border-top-color: #e63946;
        border-radius: 50%;
        animation: il-spin 0.7s linear infinite;
      }
      #initial-loader .il-text {
        font-size: 15px;
        letter-spacing: 1px;
        color: #6b6560;
      }
      @keyframes il-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes il-bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="il-trophy">🏆</div>
        <div class="il-spinner"></div>
        <div class="il-text">正在加载歌曲世界杯…</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
