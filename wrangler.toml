name = "music-world-cup"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Cloudflare Pages 部署配置
# 用法: npx wrangler pages deploy dist --project-name=music-world-cup

# ---------- 后端绑定 ----------
# 封面走 jsDelivr GitHub CDN（免卡），不再用 R2。此处保留 R2 配置备用。
# [[r2_buckets]]
# binding = "COVERS"
# bucket_name = "mwc-covers"

# 投票/榜单关系库 + 歌手数据关系表（见 db/schema.sql、db/singer-data-schema.sql）
[[d1_databases]]
binding = "DB"
database_name = "mwc-db"
database_id = "0de8ac3f-71f7-4623-a1c2-9e8d00e43ec4"
