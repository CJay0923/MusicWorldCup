# GitHub Actions: 自动部署到 Vercel
# 每次 push 到 main 分支时自动构建并部署到 Vercel
#
# 设置步骤:
#   1. 在 Vercel 控制台获取 Token: Settings → Tokens → Create Token
#   2. 在 GitHub 仓库添加 Secrets: Settings → Secrets and variables → Actions
#      - VERCEL_TOKEN: 上一步创建的 Token
#      - VERCEL_ORG_ID: Settings → General → Team ID (在 vercel.json 同级)
#      - VERCEL_PROJECT_ID: 部署后在项目设置中获取
#   3. 推送代码即可自动部署

name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod --yes
          working-directory: ./
